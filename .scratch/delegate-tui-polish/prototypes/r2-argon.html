<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delegate · Tier Picker Prototype (R2)</title>
<style>
:root {
  --bg: #f5f4f0;
  --bg-subtle: #eceae4;
  --card: #ffffff;
  --card-alt: #faf9f6;
  --fg: #181a1f;
  --fg-soft: #3a3f4b;
  --mute: #686e7c;
  --line: #dcdad3;
  --line-strong: #c2bfb6;
  --hi: #e4ecff;
  --hi-border: #3b66d4;
  --accent: #1d4ed8;
  --shadow: 0 1px 3px rgba(18, 20, 26, 0.05), 0 1px 2px rgba(18, 20, 26, 0.03);

  /* Colour-blind-safe tier system: no red, yellow, or green.
     Double-coded by luminance weight, border geometry, and shape (◆ ■ ● ▲). */
  --t4: #5b21b6;
  --t4-bg: #5b21b6;
  --t4-fg: #ffffff;

  --t3: #1d4ed8;
  --t3-bg: #1d4ed8;
  --t3-fg: #ffffff;

  --t2: #0284c7;
  --t2-bg: #e0f2fe;
  --t2-fg: #0369a1;

  --t1: #526075;
  --t1-bg: #f1f5f9;
  --t1-fg: #334155;

  --off-fg: #7b818f;
  --off-bg: transparent;
  --off-line: #c7c9d1;

  --own-fg: #525866;
  --own-line: #8f96a6;

  --panel-w: 344px;
}

:root[data-theme="dark"] {
  --bg: #101217;
  --bg-subtle: #181b23;
  --card: #171a21;
  --card-alt: #1d212a;
  --fg: #ebeef5;
  --fg-soft: #c5cad6;
  --mute: #8a92a3;
  --line: #282d39;
  --line-strong: #3a4254;
  --hi: #202d4a;
  --hi-border: #60a5fa;
  --accent: #60a5fa;
  --shadow: 0 2px 8px rgba(0, 0, 0, 0.35);

  --t4: #a78bfa;
  --t4-bg: #6d28d9;
  --t4-fg: #ffffff;

  --t3: #60a5fa;
  --t3-bg: #1d4ed8;
  --t3-fg: #ffffff;

  --t2: #38bdf8;
  --t2-bg: #0c3b5e;
  --t2-fg: #bae6fd;

  --t1: #94a3b8;
  --t1-bg: #222936;
  --t1-fg: #cbd5e1;

  --off-fg: #788091;
  --off-bg: transparent;
  --off-line: #384050;

  --own-fg: #9aa2b2;
  --own-line: #5b6478;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--fg);
  font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}

button, input, select {
  font: inherit;
  color: inherit;
}

/* Header */
.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 8px 16px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 30;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-right: 4px;
}

.brand-title {
  font-size: 14px;
  font-weight: 650;
  letter-spacing: -0.01em;
  margin: 0;
  white-space: nowrap;
}

.view-toggle {
  display: inline-flex;
  background: var(--bg-subtle);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 2px;
  gap: 2px;
}

.view-toggle button {
  border: 0;
  background: transparent;
  padding: 3px 11px;
  border-radius: 5px;
  font-size: 12px;
  font-weight: 550;
  color: var(--mute);
  cursor: pointer;
  transition: background 0.12s, color 0.12s;
}

.view-toggle button[aria-selected="true"] {
  background: var(--card);
  color: var(--fg);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
}

.divider {
  width: 1px;
  height: 18px;
  background: var(--line);
}

.chips-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.chips-label {
  font-size: 11.5px;
  color: var(--mute);
  margin-right: 2px;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 2px 10px 2px 8px;
  font-size: 12px;
  font-weight: 500;
  background: var(--card);
  color: var(--fg);
  cursor: pointer;
  user-select: none;
  transition: border-color 0.12s, opacity 0.12s, background 0.12s;
}

.chip:hover {
  border-color: var(--line-strong);
}

.chip .swatch {
  width: 8px;
  height: 8px;
  border-radius: 999px;
  flex: none;
}

.chip .cnt {
  font-size: 11px;
  color: var(--mute);
  font-variant-numeric: tabular-nums;
}

.chip[aria-pressed="false"] {
  background: var(--bg-subtle);
  color: var(--mute);
  border-style: dashed;
  opacity: 0.72;
}

.chip[aria-pressed="false"] .swatch {
  background: transparent !important;
  border: 1.5px solid currentColor;
}

.topbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}

.opt-check {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--fg-soft);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}

.opt-check input {
  margin: 0;
  accent-color: var(--accent);
}

.btn-ghost {
  border: 1px solid var(--line);
  background: var(--card-alt);
  border-radius: 6px;
  padding: 3px 10px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
}

.btn-ghost:hover {
  border-color: var(--line-strong);
  background: var(--bg-subtle);
}

/* Workspace layout (Page view) */
.workspace {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 10px var(--panel-w);
  align-items: start;
  padding: 12px 16px 28px;
  max-width: 1720px;
  margin: 0 auto;
}

.left-col {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* Board tabs */
.board-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 3px;
  background: var(--bg-subtle);
  border: 1px solid var(--line);
  border-radius: 9px;
}

.board-tab {
  border: 1px solid transparent;
  background: transparent;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 12px;
  color: var(--fg-soft);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: background 0.1s, color 0.1s;
}

.board-tab:hover {
  color: var(--fg);
  background: rgba(128, 128, 128, 0.08);
}

.board-tab[aria-selected="true"] {
  background: var(--card);
  color: var(--fg);
  font-weight: 600;
  border-color: var(--line);
  box-shadow: var(--shadow);
}

.board-tab .src-tag {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--mute);
  font-weight: 600;
}

.board-tab .comp-pill {
  font-size: 10px;
  padding: 0 5px;
  border-radius: 4px;
  background: var(--hi);
  color: var(--accent);
  font-weight: 600;
}

/* Plot card */
.plot-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--shadow);
  padding: 12px 14px 10px;
}

.plot-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 8px 16px;
  margin-bottom: 6px;
}

.plot-title-group {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}

.plot-title {
  font-size: 14px;
  font-weight: 650;
  margin: 0;
}

.plot-sub {
  font-size: 11.5px;
  color: var(--mute);
}

.plot-legend {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 11.5px;
  color: var(--fg-soft);
}

.leg-item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}

.leg-item svg {
  flex: none;
}

.plot-stage {
  width: 100%;
  overflow: hidden;
}

.plot-stage svg {
  display: block;
  width: 100%;
  height: auto;
  user-select: none;
}

.plot-empty {
  padding: 56px 20px;
  text-align: center;
  color: var(--mute);
  font-size: 13px;
}

/* SVG plot styling & linked hover states */
.axis-grid line {
  stroke: var(--line);
  stroke-width: 1;
  stroke-dasharray: 2 3;
}

.axis-border {
  stroke: var(--line-strong);
  stroke-width: 1;
  fill: none;
}

.axis-labels text {
  font-size: 11px;
  fill: var(--mute);
  font-variant-numeric: tabular-nums;
}

.axis-title {
  font-size: 11.5px;
  fill: var(--fg-soft);
  font-weight: 500;
}

.halo-text {
  paint-order: stroke;
  stroke: var(--card);
  stroke-width: 3.5px;
  stroke-linejoin: round;
}

.eff-lbl {
  font-size: 10px;
  font-weight: 600;
  fill: var(--fg-soft);
  pointer-events: none;
}

.fam-lbl {
  font-size: 11.5px;
  font-weight: 650;
  cursor: pointer;
}

.series {
  transition: opacity 0.12s ease;
}

.series-line {
  fill: none;
  stroke-width: 2.1;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0.78;
  transition: stroke-width 0.12s ease, opacity 0.12s ease;
}

.pt-group {
  transition: opacity 0.12s ease;
}

.pt-marker {
  transition: transform 0.12s ease;
}

.pt-hit {
  fill: transparent;
  cursor: pointer;
}

.pt-halo {
  fill: none;
  stroke: var(--fg);
  stroke-width: 2;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.1s ease;
}

svg.has-hot .series {
  opacity: 0.13;
}

svg.has-hot .comp-layer {
  opacity: 0.15;
}

svg.has-hot .series.is-hot {
  opacity: 1;
}

svg.has-hot .series.is-hot .series-line {
  stroke-width: 3.1;
  opacity: 0.95;
}

svg.has-hot.has-point-hot .series.is-hot .series-line {
  stroke-width: 2.2;
  opacity: 0.45;
}

svg.has-hot.has-point-hot .series.is-hot .pt-group:not(.is-point-hot) {
  opacity: 0.35;
}

svg.has-hot .pt-group.is-point-hot {
  opacity: 1 !important;
}

svg.has-hot .pt-group.is-point-hot .pt-halo {
  opacity: 1;
}

/* Not measured here strip */
.unmeasured-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 14px;
  box-shadow: var(--shadow);
}

.unmeasured-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
}

.unmeasured-title {
  font-size: 11.5px;
  font-weight: 650;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--mute);
}

.unmeasured-note {
  font-size: 11.5px;
  color: var(--mute);
}

.unmeasured-groups {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 12px;
  align-items: center;
}

.um-fam {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 7px;
  border-radius: 6px;
  background: var(--card-alt);
  border: 1px solid var(--line);
}

.um-fam.is-hot {
  background: var(--hi);
  border-color: var(--hi-border);
}

.um-fam-name {
  font-size: 11.5px;
  font-weight: 550;
  color: var(--fg-soft);
  margin-right: 2px;
  cursor: default;
}

.um-pill {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  user-select: none;
  border: 1px solid transparent;
}

.um-pill.is-point-hot {
  outline: 2px solid var(--fg);
  outline-offset: 1px;
}

/* Collapsible state box */
.state-box {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--shadow);
  overflow: hidden;
}

.state-box summary {
  padding: 8px 14px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 550;
  color: var(--fg-soft);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  user-select: none;
}

.state-box summary:hover {
  background: var(--card-alt);
}

.state-summary-left {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.state-summary-left code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
  background: var(--bg-subtle);
  padding: 1px 5px;
  border-radius: 4px;
}

.state-pre {
  margin: 0;
  padding: 10px 14px 12px;
  border-top: 1px solid var(--line);
  background: var(--card-alt);
  font: 11.5px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  max-height: 240px;
  overflow: auto;
  color: var(--fg);
  white-space: pre;
}

/* Drag handle */
.resizer {
  width: 10px;
  align-self: stretch;
  cursor: col-resize;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: none;
  position: relative;
}

.resizer::before {
  content: "";
  width: 2px;
  height: 100%;
  min-height: 320px;
  border-radius: 2px;
  background: transparent;
  transition: background 0.12s;
}

.resizer::after {
  content: "⋮";
  position: sticky;
  top: 50vh;
  font-size: 13px;
  line-height: 1;
  color: var(--mute);
  background: var(--bg);
  padding: 4px 0;
}

.resizer:hover::before,
.resizer.dragging::before {
  background: var(--accent);
}

/* Right Side Panel (Matrix) */
.side-panel {
  position: sticky;
  top: 56px;
  max-height: calc(100vh - 70px);
  display: flex;
  flex-direction: column;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--shadow);
  overflow: hidden;
}

.panel-top {
  padding: 8px 10px 6px;
  border-bottom: 1px solid var(--line);
  background: var(--card);
  flex: none;
}

.panel-counts {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 4px;
}

.count-pills {
  display: flex;
  gap: 4px;
  align-items: center;
}

.panel-hint {
  font-size: 11px;
  color: var(--mute);
}

.mx-cols-hdr {
  display: grid;
  grid-template-columns: minmax(72px, 1fr) repeat(7, 27px);
  align-items: center;
  padding: 5px 8px 4px 10px;
  background: var(--card-alt);
  border-bottom: 1px solid var(--line);
  font-size: 10.5px;
  font-weight: 650;
  color: var(--mute);
  flex: none;
}

.mx-cols-hdr span {
  text-align: center;
}

.mx-cols-hdr span:first-child {
  text-align: left;
}

.side-scroll {
  overflow-y: auto;
  overflow-x: hidden;
  flex: 1 1 auto;
  padding-bottom: 6px;
}

.mx-harness {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 10px 3px;
  font-size: 11.5px;
  font-weight: 650;
  border-top: 1px solid var(--line);
  background: var(--card);
}

.mx-harness:first-child {
  border-top: 0;
}

.mx-harness-left {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.mx-harness-meta {
  font-size: 10.5px;
  font-weight: 450;
  color: var(--mute);
}

.mx-row {
  display: grid;
  grid-template-columns: minmax(72px, 1fr) repeat(7, 27px);
  align-items: center;
  padding: 2px 8px 2px 10px;
  min-height: 27px;
  border-radius: 4px;
  transition: background 0.08s;
}

.mx-row.is-hot {
  background: var(--hi);
}

.mx-model {
  min-width: 0;
  padding-right: 6px;
  cursor: pointer;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 4px;
}

.mx-model-name {
  font-size: 12px;
  font-weight: 520;
  color: var(--fg);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.mx-row.is-hot .mx-model-name {
  font-weight: 650;
}

.mx-cell {
  width: 25px;
  height: 20px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 4px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 10.5px;
  line-height: 1;
  user-select: none;
  position: relative;
}

.mx-cell.gap {
  pointer-events: none;
}

.mx-cell.own {
  border: 1px dotted var(--own-line);
  color: var(--own-fg);
  font-size: 11px;
  cursor: default;
}

.mx-cell.lane {
  cursor: pointer;
  transition: transform 0.08s, box-shadow 0.08s;
}

.mx-cell.lane:hover,
.mx-cell.is-point-hot {
  transform: scale(1.09);
  box-shadow: 0 0 0 2px var(--fg);
  z-index: 2;
}

/* Tier mark visual differentiation (colour + border geometry + typography) */
.tmark-4 {
  background: var(--t4-bg);
  color: var(--t4-fg);
  font-weight: 750;
  border-radius: 2px;
  box-shadow: inset 0 -2.5px 0 rgba(255, 255, 255, 0.42);
}

.tmark-3 {
  background: var(--t3-bg);
  color: var(--t3-fg);
  font-weight: 650;
  border-radius: 5px;
}

.tmark-2 {
  background: var(--t2-bg);
  color: var(--t2-fg);
  border: 1.5px solid var(--t2);
  font-weight: 700;
  border-radius: 5px;
}

.tmark-1 {
  background: var(--t1-bg);
  color: var(--t1-fg);
  border: 1.5px solid var(--t1);
  font-weight: 600;
  border-radius: 999px;
}

.tmark-off {
  background: var(--off-bg);
  color: var(--off-fg);
  border: 1px dashed var(--off-line);
  font-weight: 500;
  font-size: 9.5px;
}

.mx-cell.unplotted::after {
  content: "";
  position: absolute;
  top: 2px;
  right: 2px;
  width: 3px;
  height: 3px;
  border-radius: 999px;
  background: currentColor;
  opacity: 0.65;
}

.count-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 1px 6px;
  font-size: 11px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-variant-numeric: tabular-nums;
}

/* TUI View */
.tui-wrap {
  max-width: 820px;
  margin: 18px auto 32px;
  padding: 0 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.tui-shell {
  background: #13161f;
  color: #dfe4f0;
  border: 1px solid #2b3244;
  border-radius: 10px;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
  overflow-x: auto;
}

.tui-titlebar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 14px;
  background: #1a1e2b;
  border-bottom: 1px solid #282f42;
  font: 11.5px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: #8f98ad;
}

pre.term {
  margin: 0;
  padding: 14px 16px 16px;
  font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  width: calc(80ch + 32px);
  min-width: calc(80ch + 32px);
  white-space: pre;
  color: #d9dee9;
  outline: none;
}

pre.term .t-bold {
  color: #ffffff;
  font-weight: 700;
}

pre.term .t-mute {
  color: #7d869c;
}

pre.term .t-hdr {
  color: #9aa5be;
  font-weight: 600;
}

pre.term .t-row-cur {
  background: #1d2436;
  display: inline-block;
  width: 80ch;
}

pre.term .tc {
  display: inline-block;
  width: 7ch;
  cursor: pointer;
}

pre.term .tc-cur {
  background: #2f3e63;
  color: #ffffff !important;
  font-weight: 700;
  border-radius: 2px;
}

pre.term .tc-4 { color: #c4b5fd; font-weight: 700; }
pre.term .tc-3 { color: #93c5fd; font-weight: 650; }

</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1 class="brand-title">Delegate · Tier Selection</h1>
    <div class="view-toggle" role="tablist" aria-label="View mode">
      <button type="button" id="btnViewPage" role="tab" aria-selected="true">Page</button>
      <button type="button" id="btnViewTui" role="tab" aria-selected="false">TUI (80-col)</button>
    </div>
  </div>
  <div class="divider"></div>
  <div class="chips-wrap" id="harnessChips"></div>
  <div class="topbar-right">
    <span id="pageOpts" style="display:inline-flex;gap:10px;align-items:center">
      <label class="opt-check"><input type="checkbox" id="chkShowOff" checked> Off efforts</label>
      <label class="opt-check"><input type="checkbox" id="chkShowComp"> Comparators</label>
    </span>
    <button type="button" class="btn-ghost" id="btnTheme">Dark</button>
  </div>
</header>
<main id="app"></main>
<div id="tooltip" class="tooltip" hidden></div>
<script type="application/json" id="data">/*DATA*/null</script>
<script>
(function () {
  "use strict";

  const rawText = document.getElementById("data").textContent;
  const D = JSON.parse(rawText);
  const app = document.getElementById("app");
  const tooltip = document.getElementById("tooltip");

  if (!D || !Array.isArray(D.boards) || !Array.isArray(D.lanes)) {
    app.innerHTML =
      '<div class="empty-template"><strong>No catalog data injected.</strong>' +
      "<p>Render this template with the prototype generator to populate catalog and benchmark data.</p>" +
      "<code>python3 agents/skills/delegate/scripts/bench_page_prototype.py --template ... --no-open</code></div>";
    return;
  }

  const EFF = ["none", "low", "medium", "high", "xhigh", "max", "ultra"];
  const EAB = { none: "n", low: "L", medium: "M", high: "H", xhigh: "XH", max: "MX", ultra: "U" };
  const ei = (e) => {
    const idx = EFF.indexOf(e);
    return idx < 0 ? 99 : idx;
  };

  // Colour-blind-safe harness palette without stoplight red, yellow, or green
  const HARNESS_PALETTE = {
    light: ["#b85d28", "#2563eb", "#0e7490", "#86198f", "#475569", "#6d28d9", "#0369a1", "#9a3412"],
    dark: ["#f49d6e", "#60a5fa", "#22d3ee", "#e879f9", "#94a3b8", "#c4b5fd", "#38bdf8", "#fdba74"]
  };

  const HARNESS_LIST = Array.isArray(D.harnesses) && D.harnesses.length
    ? D.harnesses.slice()
    : Array.from(new Set(D.lanes.map((l) => l.harness).filter(Boolean))).sort();

  const MODEL_TO_GROUP = new Map();
  D.lanes.forEach((l) => {
    if (l.model && l.group) MODEL_TO_GROUP.set(l.model, l.group);
  });

  function pointGroup(p) {
    if (p && MODEL_TO_GROUP.has(p.model)) return MODEL_TO_GROUP.get(p.model);
    return String((p && p.model) || "").replace(/-(none|low|medium|high|xhigh|max|ultra)$/, "");
  }

  const DEFAULT_PANEL_W = 344;
  const MIN_PANEL_W = 296;
  const MAX_PANEL_W = 560;
  const LS_WIDTH_KEY = "delegate_r2_panel_w";

  function readStoredWidth() {
    try {
      const v = Number(window.localStorage.getItem(LS_WIDTH_KEY));
      if (Number.isFinite(v) && v >= MIN_PANEL_W && v <= MAX_PANEL_W) return Math.round(v);
    } catch (_) {
      /* ignore storage errors */
    }
    return DEFAULT_PANEL_W;
  }

  function writeStoredWidth(px) {
    try {
      window.localStorage.setItem(LS_WIDTH_KEY, String(Math.round(px)));
    } catch (_) {
      /* ignore storage errors */
    }
  }

  function initialView() {
    const q = new URLSearchParams(window.location.search).get("view");
    return q === "tui" ? "tui" : "page";
  }

  const usedHarnesses = new Set(D.lanes.filter((l) => l.carried).map((l) => l.harness));
  const compBoard = D.boards.find((b) => b.id === "b0") || D.boards.find((b) => b.composite) || D.boards[0];

  const S = {
    view: initialView(),
    theme: "light",
    board: (compBoard && compBoard.id) || D.boards[0].id,
    harness: {},
    tier: {},
    carried: {},
    showOff: true,
    showComp: false,
    panelW: readStoredWidth(),
    stateOpen: false,
    hotFam: null,
    hotLane: null,
    hotOwn: null,
    tuiRow: 0,
    tuiCol: 3,
    tuiColInit: false
  };

  HARNESS_LIST.forEach((h) => {
    S.harness[h] = usedHarnesses.size ? usedHarnesses.has(h) : true;
  });

  D.lanes.forEach((l) => {
    S.carried[l.name] = Boolean(l.carried);
    S.tier[l.name] = l.tier || 1;
  });

  document.documentElement.style.setProperty("--panel-w", S.panelW + "px");

  function harnessColor(h) {
    const idx = Math.max(0, HARNESS_LIST.indexOf(h));
    const pal = HARNESS_PALETTE[S.theme] || HARNESS_PALETTE.light;
    return pal[idx % pal.length];
  }

  function boardById(id) {
    return D.boards.find((b) => b.id === id) || D.boards[0];
  }

  function isPlotted(p) {
    return Boolean(p && p.score != null && p.cost != null && p.cost > 0);
  }

  function lanePoints(board) {
    const m = new Map();
    if (!board || !Array.isArray(board.points)) return m;
    board.points.forEach((p) => {
      (p.lanes || []).forEach((l) => {
        const prev = m.get(l.name);
        if (!prev || (!isPlotted(prev) && isPlotted(p))) {
          m.set(l.name, p);
        }
      });
    });
    return m;
  }

  function ownOtherPoints(board, harness, group, laneEffortsSet) {
    const byEff = new Map();
    if (!board || !Array.isArray(board.points)) return byEff;
    board.points.forEach((p) => {
      if (p.kind !== "own_other" || (p.lanes && p.lanes.length)) return;
      if (!(p.harness || []).includes(harness)) return;
      if (pointGroup(p) !== group) return;
      if (laneEffortsSet.has(p.effort)) return;
      const prev = byEff.get(p.effort);
      if (!prev || (!isPlotted(prev) && isPlotted(p))) {
        byEff.set(p.effort, p);
      }
    });
    return byEff;
  }

  const compLP = lanePoints(compBoard);

  // Build model families grouped by harness, ordered by geometric-mean cost per task on b0 (dearest first, no points last)
  function families() {
    const famMap = new Map();
    D.lanes.forEach((l) => {
      const grp = l.group || pointGroup(l) || l.model;
      const key = l.harness + "|" + grp;
      if (!famMap.has(key)) {
        famMap.set(key, { key, harness: l.harness, group: grp, lanes: [], byEffort: new Map(), geoCost: null });
      }
      const f = famMap.get(key);
      f.lanes.push(l);
      if (!f.byEffort.has(l.effort)) f.byEffort.set(l.effort, l);
    });

    famMap.forEach((f) => {
      f.lanes.sort((a, b) => ei(a.effort) - ei(b.effort));
      const ptsByEff = new Map();
      f.lanes.forEach((l) => {
        const p = compLP.get(l.name);
        if (p && p.cost != null && p.cost > 0) ptsByEff.set(l.effort, p.cost);
      });
      const own = ownOtherPoints(compBoard, f.harness, f.group, f.byEffort);
      own.forEach((p, eff) => {
        if (!ptsByEff.has(eff) && p.cost != null && p.cost > 0) ptsByEff.set(eff, p.cost);
      });
      const costs = Array.from(ptsByEff.values());
      if (costs.length > 0) {
        const meanLog = costs.reduce((acc, c) => acc + Math.log(c), 0) / costs.length;
        f.geoCost = Math.exp(meanLog);
      } else {
        f.geoCost = null;
      }
    });

    const byH = new Map();
    HARNESS_LIST.forEach((h) => byH.set(h, []));
    famMap.forEach((f) => {
      if (!byH.has(f.harness)) byH.set(f.harness, []);
      byH.get(f.harness).push(f);
    });

    const out = [];
    byH.forEach((fams, h) => {
      if (!fams.length) return;
      fams.sort((a, b) => {
        if (a.geoCost == null && b.geoCost == null) return a.group.localeCompare(b.group);
        if (a.geoCost == null) return 1;
        if (b.geoCost == null) return -1;
        if (b.geoCost !== a.geoCost) return b.geoCost - a.geoCost;
        return a.group.localeCompare(b.group);
      });
      out.push([h, fams]);
    });
    return out;
  }

  const ALL_FAMILIES = families();
  const LANE_TO_FAM = new Map();
  ALL_FAMILIES.forEach(([, fams]) => {
    fams.forEach((f) => {
      f.lanes.forEach((l) => LANE_TO_FAM.set(l.name, f.key));
    });
  });

  function visibleFamilies() {
    return ALL_FAMILIES.filter(([h]) => S.harness[h]);
  }

  function fmtMoney(v) {
    if (v == null || !Number.isFinite(v)) return "—";
    if (v >= 100) return "$" + Math.round(v).toLocaleString();
    if (v >= 10) return "$" + v.toFixed(1);
    if (v >= 0.1) return "$" + v.toFixed(2);
    return "$" + v.toFixed(3);
  }

  function fmtScore(s, unit) {
    if (s == null || !Number.isFinite(s)) return "—";
    const digits = Math.abs(s) < 2 && unit !== "%" ? 2 : 1;
    return s.toFixed(digits) + (unit === "%" ? "%" : "");
  }

  function tierMarkClass(name) {
    return S.carried[name] ? "tmark-" + S.tier[name] : "tmark-off";
  }

  function tierLabel(name) {
    return S.carried[name] ? "T" + S.tier[name] : "off";
  }

  function tierGlyph(name) {
    if (!S.carried[name]) return "⊘";
    return { 4: "◆", 3: "■", 2: "●", 1: "▲" }[S.tier[name]] || "●";
  }

  function setLaneTier(name, val) {
    if (!name) return;
    if (val === 0 || val === "off") {
      S.carried[name] = false;
    } else if (val >= 1 && val <= 4) {
      S.carried[name] = true;
      S.tier[name] = val;
    }
    render();
  }

  function cycleLaneTier(name) {
    const cur = S.carried[name] ? S.tier[name] : 0;
    const next = (cur + 1) % 5;
    setLaneTier(name, next);
  }

  function tierLinesText() {
    return D.lanes
      .filter((l) => S.harness[l.harness] || S.carried[l.name])
      .map((l) => l.name + " " + (S.carried[l.name] ? S.tier[l.name] : "off"))
      .join("\n");
  }

  // Linked hover controller (no full re-render required on hover)
  let isRendering = false;

  function setHot(opts, scrollPanel) {
    if (isRendering) return;
    const o = opts || {};
    S.hotFam = o.fam || null;
    S.hotLane = o.lane || null;
    S.hotOwn = o.own || null;
    applyHotDOM(Boolean(scrollPanel));
  }

  function applyHotDOM(scrollPanel) {
    const hasAny = Boolean(S.hotFam || S.hotLane || S.hotOwn);
    const hasPoint = Boolean(S.hotLane || S.hotOwn);

    document.querySelectorAll(".plot-stage svg").forEach((svg) => {
      svg.classList.toggle("has-hot", hasAny);
      svg.classList.toggle("has-point-hot", hasPoint);
    });

    document.querySelectorAll(".series").forEach((g) => {
      g.classList.toggle("is-hot", g.dataset.fam === S.hotFam);
    });

    document.querySelectorAll(".pt-group").forEach((pt) => {
      const match = (S.hotLane && pt.dataset.lane === S.hotLane) || (S.hotOwn && pt.dataset.own === S.hotOwn);
      pt.classList.toggle("is-point-hot", Boolean(match));
      const marker = pt.querySelector(".pt-marker");
      if (marker) {
        if (match) {
          marker.setAttribute("transform", "scale(1.48)");
        } else {
          marker.removeAttribute("transform");
        }
      }
    });

    document.querySelectorAll(".mx-row, .um-fam").forEach((row) => {
      row.classList.toggle("is-hot", Boolean(S.hotFam && row.dataset.fam === S.hotFam));
    });

    let scrollTarget = null;
    document.querySelectorAll(".mx-cell[data-lane], .mx-cell[data-own], .um-pill[data-lane]").forEach((el) => {
      const match =
        (S.hotLane && el.dataset.lane === S.hotLane) ||
        (S.hotOwn && el.dataset.own === S.hotOwn);
      el.classList.toggle("is-point-hot", Boolean(match));
      if (match && scrollPanel && el.classList.contains("mx-cell")) {
        scrollTarget = el;
      }
    });

    if (scrollTarget) {
      scrollTarget.scrollIntoView({ block: "nearest", inline: "nearest" });
    }
  }

  function showTooltip(evt, html) {
    tooltip.innerHTML = html;
    tooltip.hidden = false;
    moveTooltip(evt);
  }

  function moveTooltip(evt) {
    if (tooltip.hidden) return;
    const pad = 14;
    const rect = tooltip.getBoundingClientRect();
    let x = evt.clientX + pad;
    let y = evt.clientY + pad;
    if (x + rect.width > window.innerWidth - 8) x = evt.clientX - rect.width - pad;
    if (y + rect.height > window.innerHeight - 8) y = evt.clientY - rect.height - pad;
    tooltip.style.left = Math.max(8, x) + "px";
    tooltip.style.top = Math.max(8, y) + "px";
  }

  function hideTooltip() {
    tooltip.hidden = true;
  }

  function escHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // SVG marker builder drawn around local (0, 0) so hover scaling is always centered across all browsers
  function drawMarker(ns, parent, kind, tier, carried, hCol) {
    const mk = (tag, attrs) => {
      const el = document.createElementNS(ns, tag);
      Object.keys(attrs).forEach((k) => el.setAttribute(k, attrs[k]));
      parent.appendChild(el);
      return el;
    };

    mk("circle", { cx: "0", cy: "0", r: "9.8", class: "pt-halo" });

    if (kind === "own_other") {
      const r = 5.2;
      mk("path", {
        d: `M 0 ${-r} L ${r} 0 L 0 ${r} L ${-r} 0 Z`,
        fill: "var(--card)",
        stroke: hCol,
        "stroke-width": "1.6",
        "stroke-dasharray": "2 1.5"
      });
    } else if (!carried) {
      mk("circle", {
        cx: "0",
        cy: "0",
        r: "5.4",
        fill: "var(--card)",
        stroke: "var(--off-fg)",
        "stroke-width": "1.6"
      });
      mk("line", {
        x1: "-3.6",
        y1: "3.6",
        x2: "3.6",
        y2: "-3.6",
        stroke: "var(--off-fg)",
        "stroke-width": "1.5"
      });
    } else if (tier === 4) {
      const r = 7.4;
      mk("path", {
        d: `M 0 ${-r} L ${r} 0 L 0 ${r} L ${-r} 0 Z`,
        fill: "var(--t4)",
        stroke: "var(--card)",
        "stroke-width": "1.6"
      });
    } else if (tier === 3) {
      const s = 11.6;
      const half = (s / 2).toFixed(1);
      mk("rect", {
        x: String(-half),
        y: String(-half),
        width: String(s),
        height: String(s),
        rx: "2.4",
        fill: "var(--t3)",
        stroke: "var(--card)",
        "stroke-width": "1.6"
      });
    } else if (tier === 2) {
      mk("circle", {
        cx: "0",
        cy: "0",
        r: "6.2",
        fill: "var(--t2)",
        stroke: "var(--card)",
        "stroke-width": "1.6"
      });
    } else {
      const r = 7.0;
      const rx = (r * 0.92).toFixed(1);
      const ry = (r * 0.72).toFixed(1);
      mk("path", {
        d: `M 0 ${-r} L ${rx} ${ry} L -${rx} ${ry} Z`,
        fill: "var(--t1)",
        stroke: "var(--card)",
        "stroke-width": "1.6"
      });
    }

    mk("circle", { cx: "0", cy: "0", r: "11", class: "pt-hit" });
  }

  function legendIconSvg(type) {
    if (type === "t4") {
      return '<svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1 L13 7 L7 13 L1 7 Z" fill="var(--t4)"/></svg>';
    }
    if (type === "t3") {
      return '<svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="2" width="10" height="10" rx="2.2" fill="var(--t3)"/></svg>';
    }
    if (type === "t2") {
      return '<svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.2" fill="var(--t2)"/></svg>';
    }
    if (type === "t1") {
      return '<svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.6 L12.6 11.8 L1.4 11.8 Z" fill="var(--t1)"/></svg>';
    }
    if (type === "off") {
      return '<svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="4.8" fill="none" stroke="var(--off-fg)" stroke-width="1.5"/><line x1="3.7" y1="10.3" x2="10.3" y2="3.7" stroke="var(--off-fg)" stroke-width="1.4"/></svg>';
    }
    return '<svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.8 L12.2 7 L7 12.2 L1.8 7 Z" fill="none" stroke="var(--own-fg)" stroke-width="1.4" stroke-dasharray="2 1.4"/></svg>';
  }

  // Render Plot SVG into host
  function renderPlot(host, board, lp, vf) {
    host.innerHTML = "";
    const W = 880;
    const H = 456;
    const M = { l: 54, r: 148, t: 18, b: 42 };

    // Count how many visible harnesses share each model group name so labels disambiguate
    const groupHarnessCount = new Map();
    vf.forEach(([, fams]) => {
      fams.forEach((f) => {
        groupHarnessCount.set(f.group, (groupHarnessCount.get(f.group) || 0) + 1);
      });
    });

    const series = [];
    vf.forEach(([h, fams]) => {
      fams.forEach((f) => {
        const pts = [];
        f.lanes.forEach((l) => {
          if (!S.showOff && !S.carried[l.name]) return;
          const p = lp.get(l.name);
          if (isPlotted(p)) {
            pts.push({ lane: l, p, kind: "lane" });
          }
        });
        if (S.showOff) {
          const own = ownOtherPoints(board, h, f.group, f.byEffort);
          own.forEach((p) => {
            if (isPlotted(p)) {
              pts.push({ lane: null, p, kind: "own_other" });
            }
          });
        }
        pts.sort((a, b) => ei(a.p.effort) - ei(b.p.effort));
        if (pts.length) {
          series.push({ f, pts });
        }
      });
    });

    const comps = S.showComp
      ? (board.points || []).filter((p) => p.kind === "comparator" && isPlotted(p))
      : [];

    const allPts = series.flatMap((s) => s.pts.map((x) => x.p)).concat(comps);
    if (!allPts.length) {
      host.innerHTML = '<div class="plot-empty">No plotted cost/score rows on this board for the selected harnesses. Unmeasured lanes remain listed below and in the matrix.</div>';
      return;
    }

    const costs = allPts.map((p) => p.cost);
    const scores = allPts.map((p) => p.score);
    const minC = Math.min(...costs);
    const maxC = Math.max(...costs);
    let x0 = Math.log10(minC / 1.35);
    let x1 = Math.log10(maxC * 1.38);
    if (x1 - x0 < 0.4) {
      const mid = (x0 + x1) / 2;
      x0 = mid - 0.25;
      x1 = mid + 0.25;
    }

    const minS = Math.min(...scores);
    const maxS = Math.max(...scores);
    const sPad = (maxS - minS) * 0.09 || Math.max(1, Math.abs(maxS) * 0.05);
    const y0 = minS - sPad;
    const y1 = maxS + sPad;

    const plotW = W - M.l - M.r;
    const plotH = H - M.t - M.b;
    const X = (c) => M.l + ((Math.log10(Math.max(c, 1e-8)) - x0) / (x1 - x0)) * plotW;
    const Y = (s) => H - M.b - ((s - y0) / (y1 - y0)) * plotH;

    // Co-location offset so shared-model lines across two harnesses stay individually visible & clickable
    const coordGroups = new Map();
    series.forEach((s, sIdx) => {
      s.pts.forEach((pt) => {
        const ck = pt.p.cost.toPrecision(6) + "|" + pt.p.score.toPrecision(6);
        if (!coordGroups.has(ck)) coordGroups.set(ck, []);
        coordGroups.get(ck).push({ sIdx, pt });
      });
    });
    coordGroups.forEach((arr) => {
      if (arr.length <= 1) {
        arr[0].pt.dx = 0;
        arr[0].pt.dy = 0;
        return;
      }
      arr.forEach((item, idx) => {
        const shift = (idx - (arr.length - 1) / 2) * 5.2;
        item.pt.dx = shift;
        item.pt.dy = -shift * 0.75;
      });
    });

    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

    const mk = (tag, attrs, par) => {
      const el = document.createElementNS(ns, tag);
      Object.keys(attrs).forEach((k) => el.setAttribute(k, attrs[k]));
      (par || svg).appendChild(el);
      return el;
    };

    const gridG = mk("g", { class: "axis-grid" });
    const lblG = mk("g", { class: "axis-labels" });

    // Log10 X ticks (thin multipliers if span is wide so labels never collide)
    const spanDecades = x1 - x0;
    const mults = spanDecades > 2.7 ? [1, 3] : [1, 2, 5];
    let lastTickX = -999;
    for (let exp = Math.floor(x0) - 1; exp <= Math.ceil(x1) + 1; exp++) {
      for (const m of mults) {
        const val = m * Math.pow(10, exp);
        const lv = Math.log10(val);
        if (lv < x0 || lv > x1) continue;
        const px = X(val);
        mk("line", { x1: px.toFixed(1), x2: px.toFixed(1), y1: M.t, y2: H - M.b }, gridG);
        if (px - lastTickX >= 42) {
          const tx = mk("text", { x: px.toFixed(1), y: H - M.b + 16, "text-anchor": "middle" }, lblG);
          tx.textContent = val >= 1 ? "$" + (Number.isInteger(val) ? val : val.toFixed(1)) : "$" + Number(val.toPrecision(2));
          lastTickX = px;
        }
      }
    }

    // Y ticks
    const ySteps = 5;
    for (let i = 0; i <= ySteps; i++) {
      const sv = y0 + ((y1 - y0) * i) / ySteps;
      const py = Y(sv);
      mk("line", { x1: M.l, x2: W - M.r, y1: py.toFixed(1), y2: py.toFixed(1) }, gridG);
      const ty = mk("text", { x: M.l - 8, y: (py + 3.5).toFixed(1), "text-anchor": "end" }, lblG);
      ty.textContent = sv.toFixed(board.unit === "%" || (y1 - y0) < 5 ? 1 : 0) + (board.unit === "%" ? "%" : "");
    }

    mk("rect", { x: M.l, y: M.t, width: plotW, height: plotH, class: "axis-border" });

    const xTitle = mk("text", { x: M.l + plotW / 2, y: H - 6, "text-anchor": "middle", class: "axis-title" });
    xTitle.textContent = `← cheaper · ${board.basis || "cost per task"} (USD, log scale)`;

    const yTitle = mk("text", {
      x: 14,
      y: M.t + plotH / 2,
      transform: `rotate(-90 14 ${M.t + plotH / 2})`,
      "text-anchor": "middle",
      class: "axis-title"
    });
    yTitle.textContent = `${board.benchmark} ↑`;

    if (comps.length) {
      const compG = mk("g", { class: "comp-layer" });
      comps.forEach((p) => {
        const cx = X(p.cost);
        const cy = Y(p.score);
        const c = mk("circle", {
          cx: cx.toFixed(1),
          cy: cy.toFixed(1),
          r: "3.2",
          fill: "var(--off-fg)",
          opacity: "0.45"
        }, compG);
        c.addEventListener("mouseenter", (e) => {
          showTooltip(
            e,
            `<div class="tt-title">${escHtml(p.published || p.name)}</div>` +
              `<div class="tt-meta">comparator · ${escHtml(p.effort)} · ${fmtScore(p.score, board.unit)} · ${fmtMoney(p.cost)}</div>`
          );
        });
        c.addEventListener("mousemove", moveTooltip);
        c.addEventListener("mouseleave", hideTooltip);
      });
    }

    const seriesLayer = mk("g", {});
    const endLabels = [];

    series.forEach((s) => {
      const hCol = harnessColor(s.f.harness);
      const g = mk("g", { class: "series", "data-fam": s.f.key }, seriesLayer);

      const polyPts = s.pts
        .map((x) => `${(X(x.p.cost) + x.dx).toFixed(1)},${(Y(x.p.score) + x.dy).toFixed(1)}`)
        .join(" ");
      const poly = mk("polyline", { points: polyPts, stroke: hCol, class: "series-line" }, g);
      poly.style.cursor = "pointer";
      poly.addEventListener("mouseenter", () => setHot({ fam: s.f.key }));
      poly.addEventListener("mouseleave", () => setHot(null));

      let prevCx = -999;
      let prevCy = -999;
      let prevBelow = false;

      s.pts.forEach((x, idx) => {
        const cx = X(x.p.cost) + x.dx;
        const cy = Y(x.p.score) + x.dy;
        const laneName = x.lane ? x.lane.name : null;
        const ownKey = !laneName ? s.f.key + "|" + x.p.effort : null;

        const ptG = mk("g", {
          class: "pt-group",
          transform: `translate(${cx.toFixed(1)}, ${cy.toFixed(1)})`
        }, g);
        if (laneName) ptG.dataset.lane = laneName;
        if (ownKey) ptG.dataset.own = ownKey;

        const markerG = mk("g", { class: "pt-marker" }, ptG);
        const carried = laneName ? S.carried[laneName] : false;
        const tier = laneName ? S.tier[laneName] : null;
        drawMarker(ns, markerG, x.kind, tier, carried, hCol);

        const closeToPrev = Math.hypot(cx - prevCx, cy - prevCy) < 19;
        const below = closeToPrev ? !prevBelow : false;
        prevCx = cx;
        prevCy = cy;
        prevBelow = below;

        const elab = mk("text", {
          x: "0",
          y: below ? "16.5" : "-9.8",
          "text-anchor": "middle",
          class: "eff-lbl halo-text"
        }, ptG);
        elab.textContent = EAB[x.p.effort] || x.p.effort;

        ptG.addEventListener("mouseenter", (e) => {
          if (laneName) {
            setHot({ fam: s.f.key, lane: laneName }, true);
            showTooltip(
              e,
              `<div class="tt-title">${escHtml(s.f.group)} <span style="color:${hCol}">(${escHtml(s.f.harness)})</span></div>` +
                `<div>Effort <b>${escHtml(x.p.effort)}</b> (${escHtml(EAB[x.p.effort] || x.p.effort)}) · <b>${tierGlyph(laneName)} ${tierLabel(laneName)}</b></div>` +
                `<div>Score <b>${fmtScore(x.p.score, board.unit)}</b> · Cost <b>${fmtMoney(x.p.cost)}</b></div>` +
                `<div class="tt-meta">${escHtml(laneName)} · click or press 1–4 / 0</div>`
            );
          } else {
            setHot({ fam: s.f.key, own: ownKey }, true);
            showTooltip(
              e,
              `<div class="tt-title">${escHtml(s.f.group)} <span style="color:${hCol}">(${escHtml(s.f.harness)})</span></div>` +
                `<div>Effort <b>${escHtml(x.p.effort)}</b> · <b>◇ measured, no lane</b></div>` +
                `<div>Score <b>${fmtScore(x.p.score, board.unit)}</b> · Cost <b>${fmtMoney(x.p.cost)}</b></div>`
            );
          }
        });
        ptG.addEventListener("mousemove", moveTooltip);
        ptG.addEventListener("mouseleave", () => {
          hideTooltip();
          setHot(null);
        });
        if (laneName) {
          ptG.addEventListener("click", (e) => {
            e.stopPropagation();
            hideTooltip();
            cycleLaneTier(laneName);
          });
        }

        if (idx === s.pts.length - 1) {
          const multi = (groupHarnessCount.get(s.f.group) || 0) > 1;
          endLabels.push({
            g,
            famKey: s.f.key,
            col: hCol,
            x: cx + 10,
            rawY: cy + 3.5,
            y: cy + 3.5,
            text: multi ? `${s.f.group} · ${s.f.harness}` : s.f.group
          });
        }
      });
    });

    // De-collide right-edge model labels so lines ending near each other remain readable
    endLabels.sort((a, b) => a.rawY - b.rawY);
    const minGap = 13.5;
    for (let i = 1; i < endLabels.length; i++) {
      if (Math.abs(endLabels[i].x - endLabels[i - 1].x) < 95) {
        if (endLabels[i].y - endLabels[i - 1].y < minGap) {
          endLabels[i].y = endLabels[i - 1].y + minGap;
        }
      }
    }
    for (let i = endLabels.length - 2; i >= 0; i--) {
      if (endLabels[i + 1].y > H - M.b - 2) {
        endLabels[i + 1].y = H - M.b - 2;
      }
      if (Math.abs(endLabels[i + 1].x - endLabels[i].x) < 95) {
        if (endLabels[i + 1].y - endLabels[i].y < minGap) {
          endLabels[i].y = Math.max(M.t + 10, endLabels[i + 1].y - minGap);
        }
      }
    }

    endLabels.forEach((lbl) => {
      const clampedX = Math.min(W - 16, lbl.x);
      const t = mk("text", {
        x: clampedX.toFixed(1),
        y: lbl.y.toFixed(1),
        fill: lbl.col,
        class: "fam-lbl halo-text"
      }, lbl.g);
      t.textContent = lbl.text;
      t.addEventListener("mouseenter", () => setHot({ fam: lbl.famKey }));
      t.addEventListener("mouseleave", () => setHot(null));
    });

    host.appendChild(svg);
  }

      const onMove = (ev) => {
        const maxAllowed = Math.min(MAX_PANEL_W, Math.max(MIN_PANEL_W, window.innerWidth - 360));
        const nextW = Math.max(MIN_PANEL_W, Math.min(maxAllowed, startW + (startX - ev.clientX)));
        S.panelW = Math.round(nextW);
        document.documentElement.style.setProperty("--panel-w", S.panelW + "px");
      };

      const onUp = () => {
        resizer.classList.remove("dragging");
        writeStoredWidth(S.panelW);
        resizer.removeEventListener("pointermove", onMove);
        resizer.removeEventListener("pointerup", onUp);
        resizer.removeEventListener("pointercancel", onUp);
      };

      resizer.addEventListener("pointermove", onMove);
      resizer.addEventListener("pointerup", onUp);
      resizer.addEventListener("pointercancel", onUp);
    });

      S.panelW = DEFAULT_PANEL_W;

    });

    wireStateBox();
    applyHotDOM(false);

  // Helpers for exact 80-column TUI view
  function fitLeft(s, len) {
    const str = String(s == null ? "" : s);
    if (str.length > len) return str.slice(0, len - 1) + "…";
    return str.padEnd(len, " ");
  }

  function fmtCost6(c) {
    if (c == null || !Number.isFinite(c)) return "    — ";
    let s;
    if (c >= 1000) s = "$" + Math.round(c / 1000) + "k";
    else if (c >= 100) s = "$" + Math.round(c);
    else if (c >= 10) s = "$" + c.toFixed(1);
    else if (c >= 0.01) s = "$" + c.toFixed(2);
    else s = "$" + c.toFixed(3).replace(/^0/, "");
    return " " + s.slice(0, 5).padStart(5, " ");
  }

  function flatTuiRows() {
    const rows = [];
    visibleFamilies().forEach(([h, fams]) => {
      fams.forEach((f, idx) => {
        rows.push({ harness: h, f, firstInHarness: idx === 0, countInHarness: fams.length });
      });
    });
    return rows;
  }

  function toggleHiddenHarnesses() {
    const anyHidden = HARNESS_LIST.some((h) => !S.harness[h]);
    if (anyHidden) {
      HARNESS_LIST.forEach((h) => {
        S.harness[h] = true;
      });
    } else if (usedHarnesses.size && usedHarnesses.size < HARNESS_LIST.length) {
      HARNESS_LIST.forEach((h) => {
        S.harness[h] = usedHarnesses.has(h);
      });
    }
    render();
  }

  function renderTuiView() {
    const board = boardById(S.board);
    const lp = lanePoints(board);
    const rows = flatTuiRows();

    if (rows.length) {
      S.tuiRow = Math.max(0, Math.min(rows.length - 1, S.tuiRow));
      if (!S.tuiColInit) {
        const firstLaneIdx = EFF.findIndex((e) => rows[S.tuiRow].f.byEffort.has(e));
        if (firstLaneIdx >= 0) S.tuiCol = firstLaneIdx;
        S.tuiColInit = true;
      }
    } else {
      S.tuiRow = 0;
    }
    S.tuiCol = Math.max(0, Math.min(EFF.length - 1, S.tuiCol));

    const hiddenList = HARNESS_LIST.filter((h) => !S.harness[h]);
    const hiddenText = hiddenList.length
      ? `hidden: ${hiddenList.join(", ")} (h: show)`
      : usedHarnesses.size < HARNESS_LIST.length
      ? "showing all harnesses (h: hide unused)"
      : "all catalog harnesses shown";

    const lines = [];
    // Line 1 (64 chars): wizard step bar
    lines.push('<span class="t-mute">start · harnesses · carry · </span><span class="t-bold">[tiers]</span><span class="t-mute"> · review · routing · confirm</span>');
    // Line 2 (<= 80 chars): ordering + hidden harnesses status
    const subRaw = fitLeft(`Order: composite geomean $/task ↓ · ${hiddenText}`, 80);
    lines.push(`<span class="t-mute">${escHtml(subRaw)}</span>`);
    lines.push("");

    // Table column header: 2 + 22 + 1 + 49 + 6 = 80 chars
    const hdrCols = ["   n   ", "   L   ", "   M   ", "   H   ", "  XH   ", "  MX   ", "   U   "].join("");
    const hdrLine = "  " + fitLeft("model", 22) + " " + hdrCols + "  $/t ";
    lines.push(`<span class="t-hdr">${escHtml(hdrLine)}</span>`);
    lines.push(`<span class="t-mute">${"─".repeat(80)}</span>`);

    if (!rows.length) {
      lines.push(`<span class="t-mute">${fitLeft("  No harnesses selected. Press h to show hidden harnesses.", 80)}</span>`);
    } else {
      rows.forEach((r, rIdx) => {
        if (r.firstInHarness) {
          const carriedN = visibleFamilies()
            .find(([xh]) => xh === r.harness)[1]
            .reduce((a, xf) => a + xf.lanes.filter((l) => S.carried[l.name]).length, 0);
          const hHead = fitLeft(`${r.harness} (${r.countInHarness} models, ${carriedN} carried)`, 80);
          lines.push(`<span class="t-bold">${escHtml(hHead)}</span>`);
        }

        const isCurRow = rIdx === S.tuiRow;
        const own = ownOtherPoints(board, r.harness, r.f.group, r.f.byEffort);
        const prefix = isCurRow ? "▸ " : "  ";
        const mName = fitLeft(r.f.group, 22);

        const cellsHtml = EFF.map((eff, cIdx) => {
          const isCurCell = isCurRow && cIdx === S.tuiCol;
          const l = r.f.byEffort.get(eff);
          let inner = "     ";
          let cls = "tc";
          if (l) {
            if (S.carried[l.name]) {
              const t = S.tier[l.name];
              const g = { 4: "◆", 3: "■", 2: "●", 1: "▲" }[t] || "●";
              inner = `${g} T${t} `;
              cls += " tc-" + t;
            } else {
              inner = "-off ";
              cls += " tc-off";
            }
          } else if (own.has(eff)) {
            inner = "  ◇  ";
            cls += " tc-own";
          }
          if (isCurCell) cls += " tc-cur";
          const txt = isCurCell ? `[${inner}]` : ` ${inner} `;
          return `<span class="${cls}" data-r="${rIdx}" data-c="${cIdx}">${escHtml(txt)}</span>`;
        }).join("");

        const costStr = fmtCost6(r.f.geoCost);
        const rowHtml = `${escHtml(prefix + mName + " ")}${cellsHtml}<span class="t-mute">${escHtml(costStr)}</span>`;
        lines.push(isCurRow ? `<span class="t-row-cur">${rowHtml}</span>` : rowHtml);
      });
    }

    lines.push(`<span class="t-mute">${"─".repeat(80)}</span>`);

    // Focus inspector line (<= 80 chars)
    let focusRaw = "focus: none";
    if (rows.length) {
      const curR = rows[S.tuiRow];
      const eff = EFF[S.tuiCol];
      const l = curR.f.byEffort.get(eff);
      const own = ownOtherPoints(board, curR.harness, curR.f.group, curR.f.byEffort);
      if (l) {
        const p = lp.get(l.name);
        const metric = isPlotted(p)
          ? `${fmtScore(p.score, board.unit)} @ ${fmtMoney(p.cost)}`
          : "not measured on board";
        focusRaw = `focus: ${l.name} · ${tierLabel(l.name)} · ${metric}`;
      } else if (own.has(eff)) {
        const op = own.get(eff);
        focusRaw = `focus: ${curR.f.group} (${eff}) · ◇ measured (${fmtScore(op.score, board.unit)}, ${fmtMoney(op.cost)}), no lane`;
      } else {
        focusRaw = `focus: ${curR.f.group} (${eff}) · blank gap (no lane runs this effort)`;
      }
    }
    lines.push(`<span class="t-focus">${escHtml(fitLeft(focusRaw, 80))}</span>`);
    lines.push("");

    // Legend & keybindings footer (each strictly <= 80 chars)
    const legLine = fitLeft("marks: ◆ T4  ■ T3  ● T2  ▲ T1  -off lane off  ◇ measured, no lane  (gap) none", 80);
    const keyLine = fitLeft("keys : ↑/↓ model  ←/→ effort  1-4 set tier  0 off  h hidden harnesses", 80);
    lines.push(`<span class="t-mute">${escHtml(legLine)}</span>`);
    lines.push(`<span class="t-bold">${escHtml(keyLine)}</span>`);

    app.innerHTML =
      '<div class="tui-wrap">' +
      '  <div class="tui-shell">' +
      '    <div class="tui-titlebar">' +
      "      <span>delegate setup · tiers (80×24 matrix mock)</span>" +
      `      <span>board: ${escHtml(board.benchmark)}</span>` +
      "    </div>" +
      `    <pre class="term" id="tuiPre" tabindex="0">${lines.join("\n")}</pre>` +
      "  </div>" +
      `  <details class="state-box" id="stateBox"${S.stateOpen ? " open" : ""}>` +
      "    <summary>" +
      '      <span class="state-summary-left">Tier lines for review paste <code>&lt;lane&gt; &lt;1-4|off&gt;</code> <span id="stateMeta" class="plot-sub"></span></span>' +
      '      <button type="button" class="btn-ghost" id="btnCopyState">Copy lines</button>' +
      "    </summary>" +
      '    <pre class="state-pre" id="statePre"></pre>' +
      "  </details>" +
      "</div>";

    document.querySelectorAll("#tuiPre .tc").forEach((el) => {
      el.addEventListener("click", () => {
        const r = Number(el.dataset.r);
        const c = Number(el.dataset.c);
        if (S.tuiRow === r && S.tuiCol === c) {
          const rowObj = rows[r];
          const lane = rowObj && rowObj.f.byEffort.get(EFF[c]);
          if (lane) cycleLaneTier(lane.name);
        } else {
          S.tuiRow = r;
          S.tuiCol = c;
          render();
        }
      });
    });

    wireStateBox();
  }

  function wireStateBox() {
    const stateBox = document.getElementById("stateBox");
    const statePre = document.getElementById("statePre");
    const stateMeta = document.getElementById("stateMeta");
    const btnCopy = document.getElementById("btnCopyState");
    if (!stateBox || !statePre) return;

    const txt = tierLinesText();
    statePre.textContent = txt;

    const activeLanes = D.lanes.filter((l) => S.harness[l.harness] || S.carried[l.name]);
    const carriedN = activeLanes.filter((l) => S.carried[l.name]).length;
    if (stateMeta) {
      stateMeta.textContent = `(${carriedN} carried / ${activeLanes.length} listed)`;
    }

    stateBox.addEventListener("toggle", () => {
      S.stateOpen = stateBox.open;
    });

    if (btnCopy) {
      btnCopy.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        try {
          navigator.clipboard.writeText(txt).then(
            () => {
              btnCopy.textContent = "Copied";
              setTimeout(() => {
                btnCopy.textContent = "Copy lines";
              }, 1200);
            },
            () => {}
          );
        } catch (_) {
          /* clipboard unavailable on some file:// contexts */
        }
      });
    }
  }

  function renderHeader() {
    document.getElementById("btnViewPage").setAttribute("aria-selected", String(S.view === "page"));
    document.getElementById("btnViewTui").setAttribute("aria-selected", String(S.view === "tui"));
    document.getElementById("pageOpts").style.display = S.view === "page" ? "inline-flex" : "none";
    document.getElementById("btnTheme").textContent = S.theme === "dark" ? "Light" : "Dark";

    const chipsHost = document.getElementById("harnessChips");
    chipsHost.innerHTML = '<span class="chips-label">Harnesses</span>';
    HARNESS_LIST.forEach((h) => {
      const total = D.lanes.filter((l) => l.harness === h).length;
      const carriedN = D.lanes.filter((l) => l.harness === h && S.carried[l.name]).length;
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip";
      chip.setAttribute("aria-pressed", String(Boolean(S.harness[h])));
      chip.innerHTML =
        `<span class="swatch" style="background:${harnessColor(h)}"></span>` +
        `<span>${escHtml(h)}</span>` +
        `<span class="cnt">${carriedN}/${total}</span>`;
      chip.addEventListener("click", () => {
        S.harness[h] = !S.harness[h];
        render();
      });
      chipsHost.appendChild(chip);
    });
  }

  function setView(v) {
    S.view = v === "tui" ? "tui" : "page";
    hideTooltip();
    try {
      const u = new URL(window.location.href);
      u.searchParams.set("view", S.view);
      window.history.replaceState(null, "", u);
    } catch (_) {
      /* ignore history errors on restricted file:// origins */
    }
    render();
  }

  function render() {
    isRendering = true;
    hideTooltip();
    renderHeader();
    if (S.view === "tui") {
      renderTuiView();
    } else {
      renderPageView();
    }
    isRendering = false;
  }

  // Topbar controls
  document.getElementById("btnViewPage").addEventListener("click", () => setView("page"));
  document.getElementById("btnViewTui").addEventListener("click", () => setView("tui"));
  document.getElementById("chkShowOff").addEventListener("change", (e) => {
    S.showOff = e.target.checked;
    render();
  });
  document.getElementById("chkShowComp").addEventListener("change", (e) => {
    S.showComp = e.target.checked;
    render();
  });
  document.getElementById("btnTheme").addEventListener("click", () => {
    S.theme = S.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = S.theme;
    render();
  });

  window.addEventListener("popstate", () => {
    S.view = initialView();
    render();
  });

  // Keyboard handling for both Page hover shortcuts and TUI matrix navigation
  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && e.target.closest && e.target.closest("input, select, textarea, [contenteditable]")) return;

    if (S.view === "tui") {
      const rows = flatTuiRows();
      if (e.key === "ArrowDown" || e.key === "j") {
        if (rows.length) S.tuiRow = Math.min(rows.length - 1, S.tuiRow + 1);
        e.preventDefault();
        render();
        return;
      }
      if (e.key === "ArrowUp" || e.key === "k") {
        if (rows.length) S.tuiRow = Math.max(0, S.tuiRow - 1);
        e.preventDefault();
        render();
        return;
      }
      if (e.key === "ArrowLeft") {
        S.tuiCol = Math.max(0, S.tuiCol - 1);
        e.preventDefault();
        render();
        return;
      }
      if (e.key === "ArrowRight") {
        S.tuiCol = Math.min(EFF.length - 1, S.tuiCol + 1);
        e.preventDefault();
        render();
        return;
      }
      if (e.key === "h" || e.key === "H") {
        e.preventDefault();
        toggleHiddenHarnesses();
        return;
      }
      if (/^[0-4]$/.test(e.key)) {
        const cur = rows[S.tuiRow];
        const lane = cur && cur.f.byEffort.get(EFF[S.tuiCol]);
        if (lane) {
          e.preventDefault();
          setLaneTier(lane.name, Number(e.key));
        }
        return;
      }
    } else {
      // Page view: pressing 1-4 or 0 while hovering a cell/dot/pill sets its tier
      if (S.hotLane && /^[0-4]$/.test(e.key)) {
        e.preventDefault();
        const targetLane = S.hotLane;
        const targetFam = S.hotFam || LANE_TO_FAM.get(targetLane) || null;
        setLaneTier(targetLane, Number(e.key));
        S.hotFam = targetFam;
        S.hotLane = targetLane;
        applyHotDOM(false);
      }
    }
  });

  render();
})();
</script>
</body>
</html>
